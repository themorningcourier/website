name: Update headlines
on:
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  headlines:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/headlines.py
      - run: |
          git config user.name "The Morning Courier"
          git config user.email "jaybe2527@gmail.com"
          git add headlines.json national.json standings.json 2>/dev/null || true
          git add -A *.json
          git diff --cached --quiet && exit 0
          git commit -m "Update headlines"
          for i in 1 2 3 4 5; do git pull --rebase -q && git push && break; echo "push failed, retry $i"; sleep $((i*15)); done
          git push
