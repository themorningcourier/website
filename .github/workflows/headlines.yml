name: Update headlines
on:
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  headlines:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/headlines.py
      - run: |
          git config user.name "The Morning Courier"
          git config user.email "jaybe2527@gmail.com"
          git add headlines.json
          git diff --cached --quiet || (git commit -m "Update headlines" && git push)
